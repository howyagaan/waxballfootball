<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waxball H2H</title>
    <meta
      name="description"
      content="Waxball head-to-head records across the 2024 and 2025 fantasy football archives."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="h2h" class="h2h-page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Waxball home">
        <span class="brand-mark has-image" id="league-brand-mark"><img alt="" src="./favicon.svg" /></span>
        <span>Waxball</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="./index.html">2026</a>
        <span class="nav-divider" aria-hidden="true">|</span>
        <a href="#compare">Compare</a>
        <a href="#quirks">Quirks</a>
        <a href="#matchup-log">Log</a>
        <a href="./archive-2025.html">2025</a>
        <a href="./archive-2024.html">2024</a>
      </nav>
    </header>

    <main id="top" class="h2h-main">
      <section id="compare" class="h2h-board" aria-live="polite">
        <div class="h2h-board-top">
          <label class="h2h-team-select">
            <span>Team</span>
            <select id="h2h-manager-a" aria-label="Choose first manager"></select>
            <strong id="h2h-card-a">Manager</strong>
          </label>

          <div class="h2h-center-score">
            <p>Waxball H2H</p>
            <strong id="h2h-series">0-0</strong>
            <span id="h2h-series-note">Choose two managers.</span>
          </div>

          <label class="h2h-team-select">
            <span>Team</span>
            <select id="h2h-manager-b" aria-label="Choose second manager"></select>
            <strong id="h2h-card-b">Manager</strong>
          </label>
        </div>

        <div class="h2h-board-line" aria-hidden="true"></div>

        <section class="h2h-board-stats" aria-label="Head-to-head summary">
          <article>
            <span>Total points</span>
            <strong id="h2h-points">--</strong>
            <p id="h2h-points-note">Combined scoring edge.</p>
          </article>
          <article>
            <span>Average margin</span>
            <strong id="h2h-margin">--</strong>
            <p id="h2h-margin-note">How sweaty the series has been.</p>
          </article>
        </section>

        <section id="matchup-log" class="h2h-score-history">
          <p id="h2h-log-note">Sorted by season.</p>
          <div id="h2h-log" class="h2h-log"></div>
        </section>

        <section id="quirks" class="h2h-fun-facts">
          <h2>Fun facts</h2>
          <div id="h2h-quirks" class="h2h-notes-grid"></div>
        </section>
      </section>
    </main>

    <script src="./assets/data/h2h-data.js"></script>
    <script src="./h2h.js"></script>
  </body>
</html>
